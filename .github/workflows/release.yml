# Builds the installers on a version tag and attaches them, with the updater's
# latest.json, to a draft release. Nothing is public until the draft is published.
name: Release

on:
  push:
    tags: ["v*"]

# the action creates the release and uploads to it
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest runner on offer: what is built there runs on more Linux systems
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          # the runner is Apple Silicon; both targets are built on it
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Agent Office ${{ github.ref_name }}
          # files are named by what they end in, so this text holds for every version
          releaseBody: |
            ## Which file do I download?

            ### Windows
            - `..._x64-setup.exe`: the installer most people want
            - `..._x64_en-US.msi`: the same app as an MSI package

            ### macOS
            - `..._aarch64.dmg`: Apple Silicon (M1 and later)
            - `..._x64.dmg`: Intel

            ### Linux
            - `..._amd64.deb`: Ubuntu and Debian
            - `..._amd64.AppImage`: any distribution, and the only one that updates itself
            - `....x86_64.rpm`: Fedora and openSUSE

            The `.sig`, `.tar.gz` and `latest.json` files are for the in-app updater. You do not need them.

            The installers are not signed with a paid certificate, so Windows and macOS warn you before the first run. The [README](https://github.com/Tuplano/agent-office-app#install) shows how to get past the warnings.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
